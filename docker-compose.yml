services:
  app:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://hireflow:hireflow@db:5432/hireflow
      DATA_DIR: /app/data
    ports:
      - "0.0.0.0:${APP_PORT:-27183}:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hireflow
      POSTGRES_USER: hireflow
      POSTGRES_PASSWORD: hireflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hireflow -d hireflow"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - hireflow-postgres:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  hireflow-postgres:
